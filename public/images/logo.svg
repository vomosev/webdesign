<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean Lines Design Logo -->
  
  <!-- Main geometric shape - abstract representation of clean lines -->
  <path d="M20 10 L50 10 L50 50 L20 50 Z" stroke="#000000" stroke-width="2" fill="none"/>
  <line x1="20" y1="30" x2="50" y2="30" stroke="#000000" stroke-width="2"/>
  <line x1="35" y1="10" x2="35" y2="50" stroke="#000000" stroke-width="2"/>
  
  <!-- Diagonal accent line -->
  <line x1="20" y1="10" x2="50" y2="50" stroke="#000000" stroke-width="1" opacity="0.3"/>
  
  <!-- Text: CLEAN LINES -->
  <text x="65" y="28" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="300" letter-spacing="2" fill="#000000">CLEAN</text>
  <text x="65" y="48" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#000000">LINES</text>
  
  <!-- Horizontal line separator -->
  <line x1="65" y1="35" x2="180" y2="35" stroke="#000000" stroke-width="1" opacity="0.2"/>
</svg>